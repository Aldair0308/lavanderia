version: "3.8"

services:
  openwa:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lavanderia-openwa
    environment:
      OPENWA_PORT: 8081
      OPENWA_API_KEY: ${OPENWA_API_KEY:-dev-key-change-me}
      WEBHOOK_URL: ${WEBHOOK_URL:-http://localhost:3100/api/whatsapp/webhook}
      SESSION_DIR: /app/session-data
    ports:
      - "8081:8081"
    volumes:
      - openwa-data:/app/session-data

volumes:
  openwa-data:
